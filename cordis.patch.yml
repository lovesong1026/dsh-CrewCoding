# dsh-crew-coding bundle patch: controlled multi-agent coding for DSH.
- insert:
    - id: crew-coding
      name: '@nanmicoder/dsh-crew-coding'
      config:
        stateDir: .crew-coding
        memberProvider: spawn
        maxMembers: 3
        memberMaxDepth: 1
        profiles:
          check:
            description: Parallel, read-only security and performance review.
            taskPlanning: seed
            protocol: >-
              Inspect only. Do not modify workspace files. Report only findings with
              concrete code evidence and a practical recommendation.
            members:
              - name: security
                role: Review authentication, input handling, secrets, and permission boundaries.
              - name: performance
                role: Review performance bottlenecks, resource use, and scalability risks.
            tasks:
              - id: security-review
                subject: Security review
                description: Review the requested scope for security and authorization risks.
                assignee: security
                dependencies: []
              - id: performance-review
                subject: Performance review
                description: Review the requested scope for performance and resource risks.
                assignee: performance
                dependencies: []
          build:
            description: Minimal coding delivery with one writer and an independent verifier.
            taskPlanning: captain
            protocol: >-
              Create the smallest useful coding graph. Implementer is the only writer;
              verifier and any specialist remain read-only. Use implementation or repair
              kinds for code changes, then run independent verification. Never create two
              concurrent write tasks.
            members:
              - name: implementer
                role: Analyze the impact and implement approved code changes.
              - name: verifier
                role: Independently review the diff and run relevant validation.
